# ============================================================
# 中文物理知识树 —— 全局元数据
# 本文件定义：站点信息、领域(domain)体系、云图参数、可视化参数、
#             关系语义（先修 / 相关 二元关系）
# 由 build.py 读取，并合并进 site/data/graph.js
# ============================================================

site:
  title: 中文物理知识树
  subtitle: Physics Knowledge Graph
  description: 从本科课程到研究方向的科学知识导航网络（物理 · 数学 · 化学 · 生命科学 · 信息 · 计算机 · 工程）

# ------------------------------------------------------------
# 领域体系：课程层 11 个子类（c- 前缀，低饱和度偏灰）+ 研究层 24 个类别（r- 前缀，高饱和度）
# 课程层分类参考北大/清华本科培养方案；研究层分类按 arXiv 顶层类别归并，
# 化学（无 arXiv）按教育部学科目录二级学科（0703）与 GB/T 13745 归并。
# 色相按学科分区间：数学=紫色（约 266°~280°）；物理=蓝紫色至蓝绿色（250°→170°）；
# 化学=绿色至黄绿色（122°→95°）；生命科学=黄绿色至黄色（78°→56°）；
# 信息/计算机/工程=紫红至粉红（306°→350°）
# 课程层分类参考北大物理学院 / 清华物理系本科培养方案；
# 研究层分类按 arXiv Physics 顶层类别归并。
# color: 节点/云图主色（16 进制）
# cloud_alpha: 云图不透明度 0~1（越小越透明，允许领域重叠）
# cloud_r: 云图半径系数（相对节点散布大小的比例）
# ------------------------------------------------------------
