<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中文物理知识树</title>
  <link rel="stylesheet" href="css/style.css?v=6">
  <link rel="stylesheet" href="js/vendor/katex/katex.min.css">
</head>
<body>

  <!-- 顶部栏 -->
  <div id="topbar">
    <div class="brand">
      <div class="title" id="brand-title">中文物理知识树</div>
      <div class="subtitle" id="brand-subtitle">PHYSICS KNOWLEDGE GRAPH</div>
    </div>
    <div id="search-wrap">
      <input id="search-input" type="text" placeholder="搜索知识点（名称 / 别名 / 标签）…" autocomplete="off">
      <div id="search-results"></div>
    </div>
    <div class="actions">
      <button id="btn-global" class="btn active">3D 全局</button>
      <button id="btn-labels" class="btn active">标签</button>
      <button id="btn-tree" class="btn">我的路径</button>
      <button id="btn-domain-hl" class="btn">分类高亮</button>
      <label class="ctl"><span id="ctl-font-label">字号</span><input id="font-slider" type="range" min="10" max="50" step="1" value="15"></label>
      <label class="ctl hidden" id="spacing-ctl"><span id="ctl-spacing-label">间距</span><input id="spacing-slider" type="range" min="50" max="300" step="5" value="100"></label>
      <button id="btn-reset" class="btn hidden">重置布局</button>
      <button id="btn-legend" class="btn">领域图例</button>
      <button id="btn-lang" class="btn" title="Switch language / 切换语言">EN</button>
      <button id="btn-login" class="btn" style="display:none;">登录</button>
      <a id="user-link" class="btn" style="display:none;" href="javascript:void(0)"></a>
      <span id="stat"></span>

      <!-- 用户下拉菜单 -->
      <div id="user-dropdown" class="hidden">
        <div class="ud-head">
          <div class="ud-name" id="ud-name"></div>
          <div class="ud-hint">GitHub 用户</div>
        </div>
        <div class="ud-actions">
          <button id="btn-user-center" class="btn" style="display:none;">用户中心</button>
          <button id="btn-logout" class="btn">退出</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 图容器 -->
  <div id="graph3d"></div>
  <div id="graph2d" class="hidden"></div>

  <!-- 2D 提示条 -->
  <div id="hint2d" class="hidden"></div>

  <!-- 领域图例 -->
  <div id="cloud-legend" class="hidden"></div>

  <!-- 分类高亮侧边栏（3D，可多选） -->
  <div id="domain-panel" class="hidden"></div>

  <!-- 树状学习图面板 -->
  <div id="tree-panel" class="hidden">
    <div id="tree-head">
      <span class="th-title" id="tree-title">我的学习路径</span>
      <div class="th-actions">
        <button id="tree-save-btn" class="btn" title="保存到森林">保存</button>
        <button id="tree-forest-btn" class="btn" title="载入已保存的学习树">已有路径</button>
        <button id="tree-clear" class="btn" title="清空">清空</button>
      </div>
    </div>
    <div id="tree-save-box" class="hidden">
      <input id="tree-name-input" type="text" placeholder="输入名称…">
      <button id="tree-save-confirm" class="btn">确认</button>
      <button id="tree-save-cancel" class="btn">取消</button>
    </div>
    <div id="tree-forest" class="hidden"></div>
    <div id="tree-list"></div>
    <div id="tree-empty">双击进入节点开始构建学习树</div>
  </div>
  <div id="tree-prompt" class="hidden"></div>

  <!-- 详情抽屉 -->
  <div id="detail" class="closed">
    <div id="detail-head">
      <div id="detail-title"></div>
      <div id="detail-sub"></div>
      <button id="detail-close" title="关闭">✕</button>
    </div>
    <div id="detail-scroll"></div>
  </div>

  <!-- 加载遮罩 -->
  <div id="loading">正在加载知识树…</div>

  <!-- 第三方库（本地化，离线可用） -->
  <script src="js/vendor/three.min.js"></script>
  <script src="js/vendor/three-timer-polyfill.js"></script>
  <script src="js/vendor/3d-force-graph.min.js"></script>
  <script src="js/vendor/force-graph.min.js"></script>
  <script src="js/vendor/marked.min.js"></script>
  <script src="js/vendor/katex.min.js"></script>
  <script src="js/vendor/auto-render.min.js"></script>

  <!-- 图数据（由 Worker 实时构建） -->
  <script src="https://pkt-oauth.pkt-oauth.workers.dev/api/graph.js" onerror="window._graphLoadFailed=true"></script>
  <script>
    if (!window.PHYSICS_GRAPH) {
      window._graphLoadFailed = true;
      // 兜底：给一个空结构，避免后面 JS 全部崩溃
      window.PHYSICS_GRAPH = { meta: { domains: {} }, nodes: [], links: [], search: [] };
    }
    if (window._graphLoadFailed) {
      document.addEventListener('DOMContentLoaded', function() {
        var el = document.createElement('div');
        el.innerHTML = '<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:#0d1117;z-index:99999;display:flex;align-items:center;justify-content:center;color:#c9d1d9;font-family:sans-serif;"><div style="max-width:480px;padding:24px;border:1px solid #30363d;border-radius:8px;background:#161b22;"><h2 style="color:#f85149;margin-top:0;">数据加载失败</h2><p>无法从 Worker 加载知识树数据，页面可能无法正常显示。</p><p style="color:#8b949e;font-size:13px;">可能原因：</p><ul style="color:#8b949e;font-size:13px;padding-left:18px;line-height:1.8;"><li>Worker 尚未部署（需运行 <code>wrangler deploy</code>）</li><li>D1 数据库为空（需执行迁移脚本）</li><li>Worker URL 配置错误</li></ul><div style="margin-top:16px;display:flex;gap:8px;"><button onclick="location.reload()" style="padding:6px 14px;background:#238636;color:#fff;border:none;border-radius:6px;cursor:pointer;">刷新重试</button><button onclick="window.location.href=\'https://pkt-oauth.pkt-oauth.workers.dev/api/graph\'" style="padding:6px 14px;background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;cursor:pointer;">查看 Worker 状态</button></div></div></div>';
        document.body.appendChild(el.firstChild);
      });
    }
  </script>

  <!-- 应用代码 -->
  <script src="js/i18n.js?v=6"></script>
  <script src="js/common.js?v=6"></script>
  <script src="js/auth.js?v=6"></script>
  <script src="js/resource-editor.js?v=6"></script>
  <script src="js/admin.js?v=6"></script>
  <script src="js/detail.js?v=6"></script>
  <script src="js/search.js?v=6"></script>
  <script src="js/tree.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
